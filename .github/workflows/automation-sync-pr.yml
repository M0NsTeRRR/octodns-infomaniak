name: Create pull request for automation-sync
on:
  push:
    branches:
      - automation-sync
permissions: {}
concurrency:
  group: automation-sync-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync-actions-lock:
    name: Sync actions.lock
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Sync actions.lock
        run: |
          gh extension install github/gh-actions-lock --pin v0.3.0 --force
          gh actions-lock --no-interactive --no-migrate-local-actions
          if [ -n "$(git status --porcelain .github/workflows)" ]; then
            git config user.name "Ludovic Ortega"
            git config user.email "ludovic.ortega@adminafk.fr"
            git add .github/workflows
            git commit -s -m "chore(git-sync): sync actions.lock"
            git push origin HEAD:automation-sync
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-pull-request:
    name: Create Pull Request
    needs: [sync-actions-lock]
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: automation-sync
          persist-credentials: false

      - name: Check for differences with main
        id: check-diff
        run: |
          git fetch origin main
          DIFF=$(git diff origin/main --name-only)
          if [ -z "$DIFF" ]; then
            echo "has_diff=false" >> $GITHUB_OUTPUT
          else
            echo "has_diff=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check-diff.outputs.has_diff == 'true'
        run: "gh pr view automation-sync && gh pr reopen automation-sync || gh pr create -B main -H automation-sync --title 'chore(git-sync): auto-applied' --body 'This PR is auto-generated by https://github.com/M0NsTeRRR/.github.'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
